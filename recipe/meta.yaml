{% set name = "cachelib" %}
{% set version = "0.17.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f3c7dc8d3c1132ab699681ffdf8a52d341d9425ac1401c538cf0b1d87b1677c8

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - setuptools
    - python
    - flit-core <4
  run:
    - python

# tests requiring a live backend server (redis/memcached/mongodb/dynamodb/valkey)
# are tagged by upstream with the "network" marker and deselected here instead
# of ignoring whole files, so the lazy/connection-check tests in the same
# modules still run
{% set ignore_tests = " -m \"not network\"" %}
# valkey is not available in the channel, and its non-network connection-check
# tests still require the package to be importable
{% set ignore_tests = ignore_tests + " --ignore=tests/test_valkey_cache.py" %}
# test_mongodb_cache.py does a bare `import pymongo` at module scope (not
# guarded by importorskip), so it must be ignored outright since pymongo is
# not a test dependency here
{% set ignore_tests = ignore_tests + " --ignore=tests/test_mongodb_cache.py" %}

test:
  source_files:
    - tests
  imports:
    - cachelib
    - cachelib.base
    - cachelib.dynamodb
    - cachelib.file
    - cachelib.memcached
    - cachelib.mongodb
    - cachelib.redis
    - cachelib.serializers
    - cachelib.simple
    - cachelib.uwsgi
    - cachelib.valkey
  requires:
    - pip
    - pytest >=8.0.0
    - pytest-xprocess >=0.23.0
    - redis-py >=6.0.0
    - boto3 >=1.43.4
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests {{ ignore_tests }}

about:
  home: https://github.com/pallets-eco/cachelib
  summary: A collection of cache libraries in the same API interface. Extracted from Werkzeug.
  description: A collection of cache libraries in the same API interface. Extracted from Werkzeug.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  doc_url: https://cachelib.readthedocs.io
  dev_url: https://github.com/pallets-eco/cachelib

extra:
  recipe-maintainers:
    - fuglede
